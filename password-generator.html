<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passcraft</title>
<style>
:root{
  --ink:#151312;
  --paper:#f6f1e8;
  --brass:#a9822f;
  --brass-dim:#8a6c28;
  --line:#d8cfb9;
  --ok:#3f6b4a;
  --mid:#a9822f;
  --weak:#a4402f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f2ede2;
    --paper:#181614;
    --line:#3a352c;
  }
}
:root[data-theme="dark"]{
  --ink:#f2ede2;
  --paper:#181614;
  --line:#3a352c;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Iowan Old Style","Georgia",serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;
  justify-content:center;
}
.wrap{
  width:100%;
  max-width:560px;
  padding:48px 24px 64px;
}
h1{
  font-size:2rem;
  font-weight:400;
  letter-spacing:0.01em;
  margin:0 0 4px;
}
.sub{
  font-family:"Courier New",monospace;
  font-size:0.85rem;
  color:var(--brass-dim);
  margin:0 0 36px;
}
.display{
  border:1px solid var(--line);
  border-radius:2px;
  padding:20px;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
  background:color-mix(in srgb, var(--paper) 92%, var(--ink) 8%);
}
#pw{
  flex:1;
  font-family:"Courier New",monospace;
  font-size:1.15rem;
  letter-spacing:0.03em;
  word-break:break-all;
  min-height:1.4em;
}
button{
  font-family:inherit;
  cursor:pointer;
  border:none;
  background:none;
  color:var(--ink);
}
.icon-btn{
  border:1px solid var(--line);
  border-radius:2px;
  width:40px;
  height:40px;
  flex:none;
  font-size:1rem;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:border-color .15s ease;
}
.icon-btn:hover{border-color:var(--brass);}
.icon-btn:focus-visible, button:focus-visible, input:focus-visible{
  outline:2px solid var(--brass);
  outline-offset:2px;
}
.strength{
  height:3px;
  background:var(--line);
  border-radius:2px;
  margin-bottom:40px;
  overflow:hidden;
}
.strength-fill{
  height:100%;
  width:0%;
  background:var(--weak);
  transition:width .2s ease, background-color .2s ease;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:14px;
}
.row label{font-size:0.95rem;}
.row .val{font-family:"Courier New",monospace;color:var(--brass-dim);}
input[type="range"]{
  width:100%;
  accent-color:var(--brass);
  margin:0 0 32px;
}
.toggles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px 20px;
  margin-bottom:36px;
}
.toggle{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:0.95rem;
  cursor:pointer;
}
.toggle input{
  width:16px;height:16px;
  accent-color:var(--brass);
}
.generate{
  width:100%;
  border:1px solid var(--ink);
  padding:14px;
  font-size:1rem;
  border-radius:2px;
  background:var(--ink);
  color:var(--paper);
  transition:opacity .15s ease;
}
.generate:hover{opacity:0.85;}
.note{
  font-family:"Courier New",monospace;
  font-size:0.78rem;
  color:var(--brass-dim);
  margin-top:14px;
  min-height:1.2em;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Passcraft</h1>
  <p class="sub">generated locally, in your browser</p>

  <div class="display">
    <div id="pw"></div>
    <button class="icon-btn" id="copyBtn" aria-label="Copy password" title="Copy">⧉</button>
    <button class="icon-btn" id="regenBtn" aria-label="Generate new password" title="Generate new">↻</button>
  </div>
  <div class="strength"><div class="strength-fill" id="strengthFill"></div></div>

  <div class="row"><label for="length">Length</label><span class="val" id="lengthVal">16</span></div>
  <input type="range" id="length" min="4" max="64" value="16">

  <div class="toggles">
    <label class="toggle"><input type="checkbox" id="lower" checked> Lowercase (a–z)</label>
    <label class="toggle"><input type="checkbox" id="upper" checked> Uppercase (A–Z)</label>
    <label class="toggle"><input type="checkbox" id="digits" checked> Digits (0–9)</label>
    <label class="toggle"><input type="checkbox" id="symbols" checked> Symbols (!@#…)</label>
  </div>

  <button class="generate" id="genBtn">Generate password</button>
  <p class="note" id="note">&nbsp;</p>
</div>

<script>
const LOWER = "abcdefghijklmnopqrstuvwxyz";
const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const DIGITS = "0123456789";
const SYMBOLS = "!@#$%^&*()_+-=[]{}|;:,.<>?";

function secureChoice(str){
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return str[arr[0] % str.length];
}

function secureShuffle(list){
  for(let i = list.length - 1; i > 0; i--){
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    const j = arr[0] % (i + 1);
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

// Direct port of generate_password() from the uploaded Python script.
function generatePassword({length = 16, useDigits = true, useSymbols = true, useUpper = true, useLower = true} = {}){
  if(!useDigits && !useSymbols && !useUpper && !useLower){
    throw new Error("At least one character type must be selected.");
  }

  let pool = "";
  const guaranteed = [];

  if(useLower){ pool += LOWER; guaranteed.push(secureChoice(LOWER)); }
  if(useUpper){ pool += UPPER; guaranteed.push(secureChoice(UPPER)); }
  if(useDigits){ pool += DIGITS; guaranteed.push(secureChoice(DIGITS)); }
  if(useSymbols){ pool += SYMBOLS; guaranteed.push(secureChoice(SYMBOLS)); }

  if(length < guaranteed.length) length = guaranteed.length;

  const remaining = [];
  for(let i = 0; i < length - guaranteed.length; i++){
    remaining.push(secureChoice(pool));
  }

  return secureShuffle(guaranteed.concat(remaining)).join("");
}

const pwEl = document.getElementById("pw");
const lengthInput = document.getElementById("length");
const lengthVal = document.getElementById("lengthVal");
const lowerBox = document.getElementById("lower");
const upperBox = document.getElementById("upper");
const digitsBox = document.getElementById("digits");
const symbolsBox = document.getElementById("symbols");
const note = document.getElementById("note");
const strengthFill = document.getElementById("strengthFill");

function currentOptions(){
  return {
    length: Number(lengthInput.value),
    useLower: lowerBox.checked,
    useUpper: upperBox.checked,
    useDigits: digitsBox.checked,
    useSymbols: symbolsBox.checked,
  };
}

function poolSize(opts){
  let n = 0;
  if(opts.useLower) n += 26;
  if(opts.useUpper) n += 26;
  if(opts.useDigits) n += 10;
  if(opts.useSymbols) n += SYMBOLS.length;
  return n;
}

function updateStrength(opts){
  const bits = opts.length * Math.log2(Math.max(poolSize(opts), 1));
  const pct = Math.min(100, (bits / 100) * 100);
  strengthFill.style.width = pct + "%";
  strengthFill.style.background = bits < 40 ? "var(--weak)" : bits < 70 ? "var(--mid)" : "var(--ok)";
  note.textContent = "~" + Math.round(bits) + " bits of entropy";
}

function refresh(){
  const opts = currentOptions();
  try{
    pwEl.textContent = generatePassword(opts);
    updateStrength(opts);
  }catch(e){
    pwEl.textContent = "";
    note.textContent = e.message;
    strengthFill.style.width = "0%";
  }
}

lengthInput.addEventListener("input", () => {
  lengthVal.textContent = lengthInput.value;
  refresh();
});
[lowerBox, upperBox, digitsBox, symbolsBox].forEach(box => box.addEventListener("change", refresh));
document.getElementById("genBtn").addEventListener("click", refresh);
document.getElementById("regenBtn").addEventListener("click", refresh);

document.getElementById("copyBtn").addEventListener("click", async () => {
  try{
    await navigator.clipboard.writeText(pwEl.textContent);
    const prev = note.textContent;
    note.textContent = "copied to clipboard";
    setTimeout(() => { note.textContent = prev; }, 1200);
  }catch(e){
    note.textContent = "couldn't copy — select and copy manually";
  }
});

refresh();
</script>
</body>
</html>
